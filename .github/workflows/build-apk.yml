name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📦 Install dependencies
        run: npm ci --legacy-peer-deps

      - name: 🔧 Expo prebuild (generate android/)
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || 'https://recojossglab.duckdns.org/api' }}
          EXPO_PUBLIC_WS_URL: ${{ vars.EXPO_PUBLIC_WS_URL || 'wss://recojossglab.duckdns.org' }}

      - name: 🏗️ Build APK for arm64 (optimizado)
        run: |
          cd android
          # Solo arm64-v8a (cubre 99% de celus modernos) - APK ~35MB
          ./gradlew assembleRelease --max-workers=2 \
            -Pandroid.injected.build.abiFilters=arm64-v8a

      - name: 📦 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SGLab-Moto-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
